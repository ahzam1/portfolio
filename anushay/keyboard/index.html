<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build a Keyboard</title>

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>

<body>

<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>Build-a-Board <span class="dot">•</span> <span class="for">for Anushay</span></h1>
      <p class="subtitle">You got a job, so obviously you need a keyboard too. Happy 9 months, my labubu.</p>
    </div>
    <ol class="stepper" id="stepper">
      <li data-step="size"><span class="num">1</span><span class="label">Size</span></li>
      <li data-step="switches"><span class="num">2</span><span class="label">Switches</span></li>
      <li data-step="keycaps"><span class="num">3</span><span class="label">Keycaps</span></li>
      <li data-step="summary"><span class="num">4</span><span class="label">Summary</span></li>
    </ol>
  </header>

  <main id="main"></main>

  <footer class="nav-controls">
    <button id="backBtn" class="ghost-btn" type="button">Back</button>
    <div class="footer-sig">made for Anushay</div>
    <button id="nextBtn" class="primary-btn" type="button" disabled>Next</button>
  </footer>

</div>

</body>
</html>
